<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | Matuail Cyber Security Force</title>

  <style>
    :root {
      --green: #087653;
      --green-dark: #065c41;
      --dark: #17201d;
      --text: #35413c;
      --muted: #74817b;
      --white: #ffffff;
      --bg: #f5f7f6;
      --border: #dfe7e3;
      --danger: #b42318;
      --danger-bg: #fff3f2;
      --success: #086746;
      --success-bg: #edf8f3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(8,118,83,.07),
          transparent 32%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      font: inherit;
    }

    /* HEADER */

    .header {
      height: 72px;
      background: rgba(255,255,255,.97);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      width: min(1120px, calc(100% - 36px));
      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      border-radius: 9px;
    }

    .brand-name {
      color: var(--dark);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
    }

    .brand-short {
      display: block;
      margin-top: 3px;

      color: var(--green);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .back-link {
      color: #66736e;
      font-size: 9px;
      font-weight: 700;
    }

    .back-link:hover {
      color: var(--green);
    }

    /* MAIN */

    main {
      min-height: calc(100vh - 72px);

      padding: 48px 18px 65px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      width: 100%;
      max-width: 470px;
    }

    .login-card {
      padding: 34px;

      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 14px;

      box-shadow:
        0 18px 55px rgba(18,35,28,.09);
    }

    .eyebrow {
      display: block;
      margin-bottom: 8px;

      color: var(--green);
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .title {
      color: var(--dark);
      font-size: 27px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .description {
      color: var(--muted);
      font-size: 9px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    /* MESSAGE */

    .message {
      display: none;

      margin-bottom: 18px;
      padding: 11px 12px;

      border-radius: 8px;

      font-size: 8px;
      line-height: 1.65;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: var(--danger);
      background: var(--danger-bg);
      border: 1px solid #f2d1ce;
    }

    .message.success {
      color: var(--success);
      background: var(--success-bg);
      border: 1px solid #cbe3d8;
    }

    /* FORM */

    .form-group {
      margin-bottom: 17px;
    }

    .form-label {
      display: block;
      margin-bottom: 7px;

      color: #46534e;
      font-size: 9px;
      font-weight: 750;
    }

    .form-input {
      width: 100%;
      height: 46px;

      padding: 0 13px;

      color: var(--dark);
      background: white;

      border: 1px solid #d5dfda;
      border-radius: 8px;

      outline: none;

      font-size: 10px;

      transition: .2s;
    }

    .form-input:focus {
      border-color: #78b69e;

      box-shadow:
        0 0 0 3px rgba(8,118,83,.07);
    }

    .form-input::placeholder {
      color: #a0aaa6;
    }

    /* PASSWORD */

    .password-box {
      position: relative;
    }

    .password-box .form-input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-50%);

      border: 0;
      background: transparent;

      color: var(--green);

      font-size: 8px;
      font-weight: 800;
    }

    /* OPTIONS */

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-top: 3px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #7a8580;
      font-size: 8px;
    }

    .remember input {
      width: 14px;
      height: 14px;
      accent-color: var(--green);
    }

    .forgot {
      color: var(--green);
      font-size: 8px;
      font-weight: 800;
    }

    .forgot:hover {
      text-decoration: underline;
    }

    /* BUTTON */

    .login-button {
      width: 100%;
      height: 46px;

      margin-top: 22px;

      color: white;
      background: var(--green);

      border: 0;
      border-radius: 8px;

      font-size: 9px;
      font-weight: 800;

      transition: .2s;
    }

    .login-button:hover {
      background: var(--green-dark);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    /* REGISTER */

    .register-area {
      margin-top: 23px;
      padding-top: 21px;

      border-top: 1px solid #edf1ef;

      text-align: center;
    }

    .register-text {
      color: var(--muted);
      font-size: 8px;
    }

    .register-link {
      margin-left: 4px;

      color: var(--green);
      font-size: 9px;
      font-weight: 800;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 16px;

      color: #929c98;
      font-size: 7px;
      line-height: 1.7;

      text-align: center;
    }

    @media (max-width: 520px) {

      .header {
        height: 66px;
      }

      .header-inner {
        width: calc(100% - 28px);
      }

      .brand-logo {
        width: 39px;
        height: 39px;
      }

      .brand-name {
        font-size: 10px;
      }

      main {
        min-height: calc(100vh - 66px);
        padding: 32px 14px 45px;
      }

      .login-card {
        padding: 26px 20px;
      }

      .title {
        font-size: 25px;
      }
    }

    @media (max-width: 390px) {

      .back-link {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <div class="header-inner">

      <a
        href="index.html"
        class="brand"
      >

        <img
          src="logo.png"
          alt="Matuail Cyber Security Force"
          class="brand-logo"
        >

        <div>

          <div class="brand-name">
            Matuail Cyber Security Force
          </div>

          <span class="brand-short">
            MCSF
          </span>

        </div>

      </a>

      <a
        href="index.html"
        class="back-link"
      >
        ← Back to website
      </a>

    </div>

  </header>


  <!-- MAIN -->

  <main>

    <div class="login-wrapper">

      <section class="login-card">

        <span class="eyebrow">
          MCSF Member Portal
        </span>

        <h1 class="title">
          Welcome back
        </h1>

        <p class="description">
          Sign in to access your authorized MCSF member account.
        </p>


        <!-- MESSAGE -->

        <div
          id="message"
          class="message"
          role="alert"
          aria-live="polite"
        ></div>


        <!-- FORM -->

        <form
          id="loginForm"
          novalidate
        >

          <div class="form-group">

            <label
              class="form-label"
              for="email"
            >
              Email
            </label>

            <input
              id="email"
              class="form-input"
              type="email"
              placeholder="Enter your email address"
              autocomplete="email"
              required
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="password"
            >
              Password
            </label>

            <div class="password-box">

              <input
                id="password"
                class="form-input"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
              >
                Show
              </button>

            </div>

          </div>


          <div class="options">

            <label class="remember">

              <input
                id="remember"
                type="checkbox"
                checked
              >

              Remember me

            </label>


            <a
              href="forgot-password.html"
              class="forgot"
            >
              Forgot password?
            </a>

          </div>


          <button
            id="loginButton"
            class="login-button"
            type="submit"
          >
            Sign In
          </button>

        </form>


        <!-- REGISTER -->

        <div class="register-area">

          <span class="register-text">
            Don't have an account?
          </span>

          <a
            href="register.html"
            class="register-link"
          >
            Register
          </a>

        </div>


        <p class="security-note">
          Access is restricted to authorized MCSF accounts.
          Never share your password or authentication information.
        </p>

      </section>

    </div>

  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://avxfxwyahujnhfhfqoih.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_viwcMj3ZBDWtkt6Wl2GUnA_zp7ASREi";


    const {
      createClient
    } = window.supabase;


    const supabaseClient =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    const form =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");


    /* MESSAGE */

    function showMessage(
      text,
      type = "error"
    ) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className =
        "message";

    }


    /* SHOW / HIDE PASSWORD */

    togglePassword.addEventListener(
      "click",
      function() {

        if (
          passwordInput.type === "password"
        ) {

          passwordInput.type = "text";

          togglePassword.textContent =
            "Hide";

        }

        else {

          passwordInput.type = "password";

          togglePassword.textContent =
            "Show";

        }

      }
    );


    /* LOGIN */

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        clearMessage();


        const email =
          emailInput.value.trim()
          .toLowerCase();

        const password =
          passwordInput.value;


        if (!email) {

          showMessage(
            "Please enter your email address."
          );

          emailInput.focus();

          return;

        }


        if (!password) {

          showMessage(
            "Please enter your password."
          );

          passwordInput.focus();

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Signing in...";


        try {

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({

                email: email,

                password: password

              });


          if (error) {
            throw error;
          }


          if (!data.user) {

            throw new Error(
              "Unable to sign in."
            );

          }


          /*
          ============================================
          CHECK MEMBER STATUS
          ============================================
          */

          const {
            data: member,
            error: memberError
          } =
            await supabaseClient
              .from("members")
              .select("status, role, full_name, username")
              .eq("user_id", data.user.id)
              .maybeSingle();


          if (memberError) {

            console.error(
              "Member lookup error:",
              memberError
            );

            /*
            Authentication succeeded even if
            the member profile cannot be read.
            */

            window.location.href =
              "members.html";

            return;

          }


          if (!member) {

            await supabaseClient.auth.signOut();

            throw new Error(
              "Your account was authenticated, but no MCSF member profile was found."
            );

          }


          /*
          ============================================
          STATUS CHECK
          ============================================
          */

          if (
            member.status === "pending"
          ) {

            await supabaseClient.auth.signOut();

            showMessage(
              "Your account is registered successfully, but your MCSF membership is still pending approval."
            );

            return;

          }


          if (
            member.status === "suspended" ||
            member.status === "rejected"
          ) {

            await supabaseClient.auth.signOut();

            showMessage(
              "Your MCSF member account is currently not authorized to sign in."
            );

            return;

          }


          /*
          ============================================
          APPROVED ACCOUNT
          ============================================
          */

          showMessage(
            "Login successful. Redirecting...",
            "success"
          );


          setTimeout(
            function() {

              window.location.href =
                "members.html";

            },
            700
          );

        }

        catch (error) {

          console.error(
            "MCSF login error:",
            error
          );


          let errorText =
            error.message ||
            "Sign in failed. Please try again.";


          if (
            errorText
              .toLowerCase()
              .includes("invalid login credentials")
          ) {

            errorText =
              "Incorrect email or password.";

          }


          if (
            errorText
              .toLowerCase()
              .includes("email not confirmed")
          ) {

            errorText =
              "Please confirm your email address first. Check your inbox for the Supabase confirmation email.";

          }


          showMessage(
            errorText
          );

        }

        finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Sign In";

        }

      }
    );

  </script>

</body>
</html>
